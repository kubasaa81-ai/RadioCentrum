name: Buduj APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Budowanie
        run: gradle --no-daemon assembleDebug

      - name: Przygotuj pliki APK
        run: |
          mkdir out
          cp radio/build/outputs/apk/debug/radio-debug.apk out/RADIO-RadioCentrum.apk
          cp telefon/build/outputs/apk/debug/telefon-debug.apk out/TELEFON-RadioCentrum.apk
          cp koniec/build/outputs/apk/debug/koniec-debug.apk out/TELEFON-KoniecJazdy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RadioCentrum-APK
          path: out/*.apk

      - name: Wydanie (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Radio Centrum v${{ github.run_number }}
          files: out/*.apk
          make_latest: true
